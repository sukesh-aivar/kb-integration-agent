# Default configuration for the Knowledge Base Integration Agent.
#
# Everything tunable lives here, never hard-coded in modules (spec 7.4). A
# reviewer must be able to retune without a redeploy. Values marked
# "TODO(confirm)" are placeholders tracked in OPEN_QUESTIONS.md and MUST NOT be
# silently treated as final.

# --- Reproducibility (spec 2.3) ---
seed: 42                       # single seed fed to UMAP/HDBSCAN and any sampling

# --- Routing thresholds (spec 4.2 rule table) ---
# These feed config/routing_rules.yaml. Kept here so a reviewer tunes numbers in
# one place.
routing:
  min_chars_per_page: 100      # below this, a PDF page is treated as scanned -> BDA
  max_image_area_ratio: 0.5    # image area / page area above this -> BDA
  max_tables: 3                # detected tables at/above this -> BDA
  max_file_size_mb: 50         # hard cap in validate_uploads stage A
  # Deterministic escalation backstop (safety net after a DEFAULT parse):
  escalation:
    min_chars_per_page_floor: 50
    max_garbled_char_ratio: 0.15

# --- Validation (spec 4.2 validate_uploads) ---
validation:
  # TODO(confirm) OPEN_QUESTIONS Q5: non-English handling. Placeholder = "flag".
  non_english_action: flag     # one of: flag | reject | ignore
  pii_regex_enabled: true

# --- Knowledge base (spec 4.2 kb_create/ingest/retrieve) ---
knowledge_base:
  # TODO(confirm) OPEN_QUESTIONS Q7: S3 Vectors vs OpenSearch Serverless.
  vector_store: s3_vectors     # one of: s3_vectors | opensearch_serverless
  chunking_strategy: hierarchical   # fixed_size | hierarchical | semantic
  retrieval_top_k: 5           # recall@5 baseline

# --- Clustering (spec 4.3 intent_cluster) ---
clustering:
  cluster_threshold: 500       # >=: UMAP+HDBSCAN ; <: LLM categorise (heuristic)
  umap:
    n_components: 10           # 5-15; number of AXES, not number of intents
    metric: cosine
  hdbscan:
    min_cluster_size: 15       # "smallest group I'd call an intent"

# --- Drafting (spec 4.4 draft_article) ---
drafting:
  # TODO(confirm) OPEN_QUESTIONS Q3: is ">=5 source tickets" the intended reading?
  min_source_tickets: 5

# --- Coverage check (spec 4.4) ---
coverage:
  retrieval_score_threshold: 0.5
  top_intents_to_test: 10

# --- Planner (spec 6). DEFAULT OFF pending OPEN_QUESTIONS Q12. ---
# The planner is fully implemented and tested, but disabled by default: the
# deterministic pipeline runs unless a reviewer/operator sets enabled: true.
planner:
  enabled: false
  max_planner_steps: 20
  max_retune_attempts_per_stage: 2

# --- Cost guards (spec 4.2 bda_process) ---
cost:
  bda_page_cap_per_run: 2000
  bda_budget_usd_per_run: 50

# --- Prompt/model version pinning recorded in every run manifest (spec 2.3) ---
versions:
  prompt_pack: "v0.1"
