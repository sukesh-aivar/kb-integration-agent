# Default configuration for the Knowledge Base Integration Agent.
#
# Everything tunable lives here, never hard-coded in modules (spec 7.4). A
# reviewer must be able to retune without a redeploy. Values marked
# "TODO(confirm)" are placeholders tracked in OPEN_QUESTIONS.md and MUST NOT be
# silently treated as final.

# --- Reproducibility (spec 2.3) ---
seed: 42                       # single seed fed to UMAP/HDBSCAN and any sampling

# --- Workflow (v3 KB-only reorg, A4.3) ---
# mode must be kb_only; any other value fails at load. legacy_stage_placeholders
# makes the reported stage order the original 13 (nine dormant stages shown as
# skipped) for an unchanged 13-step consumer. legacy_status_needs_review is a
# Part-B flag (re-emit completed as needs_review); default false.
workflow:
  mode: kb_only
  legacy_stage_placeholders: false
  legacy_status_needs_review: false

# --- Routing thresholds (spec 4.2 rule table) ---
# These feed config/routing_rules.yaml. Kept here so a reviewer tunes numbers in
# one place.
routing:
  min_chars_per_page: 100      # below this, a PDF page is treated as scanned -> BDA
  max_image_area_ratio: 0.5    # image area / page area above this -> BDA
  max_tables: 3                # detected tables at/above this -> BDA
  max_file_size_mb: 50         # hard cap in validate_uploads stage A
  # Deterministic escalation backstop (safety net after a DEFAULT parse):
  escalation:
    min_chars_per_page_floor: 50
    max_garbled_char_ratio: 0.15

# --- Source handling + many-files limits (Part B B3/B6) ---
# source.max_file_mb and source.kb_path_max_mb are referenced by name from
# config/routing_rules.yaml (rules 16, 14, 17, 18, 1).
source:
  max_files: 100               # TODO(confirm) B-Q1; KB job supports up to 1000 (BDA)
  max_file_mb: 500             # hard ceiling; over it -> REJECT
  kb_path_max_mb: 50           # Bedrock KB per-file limit (verified)
  bda_max_pages: 3000          # BDA native per-document page limit (verified)

# --- Multi-file processing (Part B B3/B6) ---
processing:
  max_workers: 4               # local pool size
  bda_concurrency: 3           # TODO(confirm) B-Q7 BDA account concurrency quota
  temp_dir: /tmp

# --- Provisioning: create-or-verify (Part B B4/B6) ---
provisioning:
  enabled: true                # false -> use the hand-built KB_AGENT_VECTOR_INDEX_ARN
  vector_bucket_name: kb-agent-vectors
  name_prefix: kb-
  ds_prefix: ds-
  kb_source_root: projects
  lock_ttl_seconds: 300
  lock_wait_seconds: 900
  data_deletion_policy: DELETE # DELETE | RETAIN (verified default DELETE)

# --- Vector store (S3 Vectors) index parameters (Part B B4.2/B6) ---
# IMMUTABLE after index creation (dimension/metric/non_filterable_keys); a
# mismatch on a returning project is a provisioning_conflict, never an update.
vector_store:
  type: s3_vectors
  dimension: 1024              # must equal the embedding model output (Titan v2)
  distance_metric: cosine
  data_type: float32
  non_filterable_keys:         # 9 of the 10-key limit
    - AMAZON_BEDROCK_TEXT
    - AMAZON_BEDROCK_METADATA
    - source
    - source_type
    - route
    - content_hash
    - run_id
    - ingested_at
    - language

# --- Ingestion-job polling (Part B B5/B6) ---
ingestion:
  poll_seconds: 10
  timeout_seconds: 3600

# --- Structured-conversion limits (Part B B2.6/B6) ---
json:
  max_depth: 5                 # dotted-key flatten depth cap
  max_input_mb: 50

# --- Validation (spec 4.2 validate_uploads) ---
validation:
  # TODO(confirm) OPEN_QUESTIONS Q5: non-English handling. Placeholder = "flag".
  non_english_action: flag     # one of: flag | reject | ignore
  pii_regex_enabled: true

# --- Knowledge base (spec 4.2 kb_create/ingest/retrieve) ---
knowledge_base:
  # TODO(confirm) OPEN_QUESTIONS Q7: S3 Vectors vs OpenSearch Serverless.
  vector_store: s3_vectors     # one of: s3_vectors | opensearch_serverless
  chunking_strategy: hierarchical   # fixed_size | hierarchical | semantic
  retrieval_top_k: 5           # recall@5 baseline

# --- DORMANT (v3): clustering/drafting/coverage/planner belong to the dormant
# ticket+join workflow. Kept for when those stages return; not read by the active
# KB-only workflow. Do not delete. ---

# --- Clustering (spec 4.3 intent_cluster) --- DORMANT
clustering:
  cluster_threshold: 500       # >=: UMAP+HDBSCAN ; <: LLM categorise (heuristic)
  umap:
    n_components: 10           # 5-15; number of AXES, not number of intents
    metric: cosine
  hdbscan:
    min_cluster_size: 15       # "smallest group I'd call an intent"

# --- Drafting (spec 4.4 draft_article) ---
drafting:
  # TODO(confirm) OPEN_QUESTIONS Q3: is ">=5 source tickets" the intended reading?
  min_source_tickets: 5

# --- Coverage check (spec 4.4) ---
coverage:
  retrieval_score_threshold: 0.5
  top_intents_to_test: 10

# --- Planner (spec 6). DEFAULT OFF pending OPEN_QUESTIONS Q12. ---
# The planner is fully implemented and tested, but disabled by default: the
# deterministic pipeline runs unless a reviewer/operator sets enabled: true.
planner:
  enabled: false
  max_planner_steps: 20
  max_retune_attempts_per_stage: 2

# --- Prompt/model version pinning recorded in every run manifest (spec 2.3) ---
versions:
  prompt_pack: "v0.1"
