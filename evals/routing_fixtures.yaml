# Routing fixtures: file -> expected route (spec 7.5, 1.5 routing accuracy).
#
# One entry per routing rule so every rule in config/routing_rules.yaml has at
# least one case that exercises it (Part B revised table). The router is run over
# these fixtures and scored with evals.metrics.routing_accuracy.
#
# These describe the FEATURES a file would present (so the router can be tested
# without the actual binary files existing) plus the expected route and the
# rule_id that should fire. `format` is the short routing format from
# detect_format; `size_bytes` defaults to a small in-limit value when omitted.
#
# route: DEFAULT | BDA | CONVERT | REJECT
# expected_rule_id must match the rule in config/routing_rules.yaml that wins.

fixtures:
  - name: empty_file
    expected_route: REJECT
    expected_rule_id: 15
    features: { format: "txt", size_bytes: 0 }

  - name: oversize_file
    expected_route: REJECT
    expected_rule_id: 16
    features: { format: "pdf", size_bytes: 600000000 } # > source.max_file_mb (500 MB)

  - name: standalone_png_image
    expected_route: BDA
    expected_rule_id: 2
    features: { format: "png" }

  - name: json_file
    expected_route: CONVERT
    expected_rule_id: 11
    features: { format: "json" }

  - name: jsonl_file
    expected_route: CONVERT
    expected_rule_id: 11
    features: { format: "jsonl" }

  - name: csv_file
    expected_route: CONVERT
    expected_rule_id: 12
    features: { format: "csv" }

  - name: xlsx_file
    expected_route: CONVERT
    expected_rule_id: 13
    features: { format: "xlsx" }

  - name: legacy_xls_file
    expected_route: REJECT
    expected_rule_id: 19
    features: { format: "xls" }

  - name: plain_text_file
    expected_route: DEFAULT
    expected_rule_id: 1
    features: { format: "txt" }

  - name: markdown_file
    expected_route: DEFAULT
    expected_rule_id: 1
    features: { format: "md" }

  - name: oversize_text_file
    expected_route: REJECT
    expected_rule_id: 14
    features: { format: "md", size_bytes: 60000000 } # > source.kb_path_max_mb (50 MB)

  - name: docx_with_embedded_images
    expected_route: BDA
    expected_rule_id: 3
    features: { format: "docx", embedded_images: 4, complex_tables: 0 }

  - name: docx_with_complex_tables
    expected_route: BDA
    expected_rule_id: 3
    features: { format: "docx", embedded_images: 0, complex_tables: 2 }

  - name: oversize_docx
    expected_route: BDA
    expected_rule_id: 17
    features: { format: "docx", size_bytes: 60000000 } # > kb_path_max_mb -> BDA

  - name: plain_docx
    expected_route: DEFAULT
    expected_rule_id: 4
    features: { format: "docx", embedded_images: 0, complex_tables: 0 }

  - name: encrypted_pdf
    expected_route: REJECT
    expected_rule_id: 5
    features: { format: "pdf", pdf_encrypted_or_unreadable: true }

  - name: oversize_pdf
    expected_route: BDA
    expected_rule_id: 18
    features: { format: "pdf", size_bytes: 60000000 } # > kb_path_max_mb -> BDA

  - name: scanned_pdf_low_text
    expected_route: BDA
    expected_rule_id: 6
    features: { format: "pdf", min_page_chars: 12 } # below routing.min_chars_per_page (100)

  - name: image_heavy_pdf
    expected_route: BDA
    expected_rule_id: 7
    features: { format: "pdf", min_page_chars: 500, max_page_image_area_ratio: 0.8 }

  - name: table_heavy_pdf
    expected_route: BDA
    expected_rule_id: 8
    features: { format: "pdf", min_page_chars: 500, detected_tables: 5 }

  - name: multi_column_pdf
    expected_route: BDA
    expected_rule_id: 9
    features: { format: "pdf", min_page_chars: 500, multi_column: true }

  - name: clean_single_column_pdf
    expected_route: DEFAULT
    expected_rule_id: 10
    features: { format: "pdf", min_page_chars: 1200, detected_tables: 0, multi_column: false }

  - name: unknown_format
    expected_route: REJECT
    expected_rule_id: 99
    features: { format: "unknown" }
